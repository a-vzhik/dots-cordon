syntax = "proto3";

package dotscordon.v1;

option go_package = "github.com/a-vzhik/dots-cordon/api/dotscordon/v1;dotscordonv1";

// GameService owns in-memory games. Each move identifies its player explicitly.
// Requests for the same game are serialized before checking player and position.
service GameService {
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc GetGame(GetGameRequest) returns (GetGameResponse);
  rpc MakeMove(MakeMoveRequest) returns (MakeMoveResponse);
  rpc ResetGame(ResetGameRequest) returns (ResetGameResponse);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);
  // Apply a move to an isolated state for tree search. No session is read or written.
  rpc SimulateMove(SimulateMoveRequest) returns (MakeMoveResponse);
}

message SimulateMoveRequest {
  GameState game = 1;
  Coordinate position = 2;
  reserved 3;
  reserved "max_turns";
  // Required: the player making this move (0 or 1).
  optional uint32 player = 4;
}

message CreateGameRequest {
  uint32 rows = 1;
  uint32 columns = 2;

  // Zero means that the game ends only when the board is full.
  uint32 max_turns = 3;
}

message CreateGameResponse {
  GameState game = 1;
}

message GetGameRequest {
  string game_id = 1;
}

message GetGameResponse {
  GameState game = 1;
}

message MakeMoveRequest {
  string game_id = 1;

  reserved 2;
  reserved "expected_turn";
  Coordinate position = 3;
  // Required: must match GameState.next_turn_by. Stale but legal moves are allowed.
  optional uint32 player = 4;
}

message MakeMoveResponse {
  GameState game = 1;
  MoveResult result = 2;
}

message ResetGameRequest {
  string game_id = 1;
}

message ResetGameResponse {
  GameState game = 1;
}

message DeleteGameRequest {
  string game_id = 1;
}

message DeleteGameResponse {}

message GameState {
  string game_id = 1;
  Board board = 2;

  // Always contains [player_0_score, player_1_score].
  repeated uint32 scores = 3;
  // Explicit player to move next (0 or 1). Player 0 starts each game.
  uint32 next_turn_by = 4;

  reserved 5;
  reserved "turn", "current_player";
  bool terminal = 6;
  TerminationReason termination_reason = 7;
  // Optional episode limit. Zero means no limit; count owned dots, including captures.
  uint32 max_turns = 8;
}

message Board {
  uint32 rows = 1;
  uint32 columns = 2;

  // Row-major cell values. Every byte is one of the Cell enum values below.
  // This compact representation can be read directly as a uint8 tensor.
  bytes cells = 3;
}

enum Cell {
  CELL_EMPTY = 0;
  CELL_PLAYER_0 = 1;
  CELL_PLAYER_1 = 2;
  CELL_DEAD_EMPTY = 3;
  CELL_DEAD_PLAYER_0 = 4;
  CELL_DEAD_PLAYER_1 = 5;
}

enum TerminationReason {
  TERMINATION_REASON_UNSPECIFIED = 0;
  TERMINATION_REASON_BOARD_FULL = 1;
  TERMINATION_REASON_TURN_LIMIT = 2;
}

message MoveResult {
  uint32 player = 1;
  uint32 scored_points = 2;
  repeated Coordinate killed_cells = 3;
  repeated Cordon cordons = 4;
}

message Cordon {
  repeated Coordinate positions = 1;
}

message Coordinate {
  uint32 row = 1;
  uint32 column = 2;
}
