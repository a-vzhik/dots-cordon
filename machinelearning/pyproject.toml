[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-cordon-ml"
version = "0.1.0"
description = "Server-backed self-play training for Dots Cordon"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70,<2",
    "numpy>=2,<3",
    "protobuf>=7.36,<8",
    "torch>=2.6,<3",
]

[project.scripts]
dots-cordon-train = "dots_cordon_ml.train:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
