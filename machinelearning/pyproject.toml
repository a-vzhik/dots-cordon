[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-cordon-ml"
version = "0.1.0"
description = "Server-backed self-play training for Dots Cordon"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "grpcio>=1.70,<2",
    "numpy>=2,<3",
    "protobuf>=7.36,<8",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "torch>=2.6,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
dots-cordon-train = "dots_cordon_ml.train:main"
dots-cordon-evaluate = "dots_cordon_ml.evaluate:main"
dots-cordon-head-to-head = "dots_cordon_ml.head_to_head:main"
dots-cordon-champion-loop = "dots_cordon_ml.champion_loop:main"
dots-cordon-audit = "dots_cordon_ml.audit.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dots_cordon_ml*"]

[tool.setuptools.package-data]
"dots_cordon_ml.audit" = ["migrations/script.py.mako"]
"dots_cordon_ml.audit.web" = ["static/index.html", "static/assets/*"]
